{% extends "base.html" %}{% block content %}<section class="formpage reveal"><div><b>CLAIM REQUEST</b><h1>{{item.title}}</h1><p>Describe a unique detail to prove ownership. Your request is reviewed by an administrator.</p>{% if item.pickup_location %}<div class="tip-card">📍 <strong>Pickup point:</strong> {{item.pickup_location}}</div>{% endif %}</div><form class="form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your Name<input name="student_name" required maxlength="150" autocomplete="name"></label><label>Roll Number<input name="roll_number" required maxlength="100"></label><label>Proof<textarea name="proof" required maxlength="2000" placeholder="Describe a unique detail that only the owner would know..."></textarea></label><button class="btn wide" type="submit">Submit Claim</button></form></section>{% endblock %}
