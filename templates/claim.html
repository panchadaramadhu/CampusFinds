{% extends "base.html" %}{% block content %}<section class="formpage reveal"><div><b>CLAIM REQUEST</b><h1>{{item.title}}</h1><p>Submit a claim for this item. Your request is sent to the administrator for verification before the item is marked as claimed.</p></div><form class="form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" value="{{ session.get('user_name', '') }}" required maxlength="150"></label><label>Proof / identifying details<textarea name="proof" required maxlength="2000" placeholder="Describe a unique detail that helps the admin verify your claim..."></textarea></label><button class="btn wide" type="submit">Submit Claim</button></form></section>{% endblock %}
