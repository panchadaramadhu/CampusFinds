{% extends "base.html" %}{% block content %}
<section class="profile-page reveal"><div class="profile-card"><h1>My Profile</h1><p>Update your profile picture.</p><div class="profile-preview">{% if user.profile_photo %}<img src="{{ url_for('profile_photo', user_id=user.id) }}" alt="Profile picture">{% else %}<div class="profile-big-avatar">{{ user.name[:1]|upper }}</div>{% endif %}</div><h2>{{ user.name }}</h2><p>{{ user.email }}</p><form class="form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Profile picture<input type="file" name="profile_photo" accept="image/png,image/jpeg,image/webp" required></label><button class="btn wide" type="submit">Save Profile Picture</button></form><a class="summary-btn primary" href="{{ url_for('home') }}">← Back to Dashboard</a></div></section>{% endblock %}
