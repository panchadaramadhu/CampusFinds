{% extends "base.html" %}{% block content %}<section class="formpage"><div><b>NEW REPORT</b><h1>Every detail helps.</h1><p>Give enough information so the owner can recognize the item.</p></div><form class="form" method="post" enctype="multipart/form-data"><label>Type<select name="kind"><option>Lost</option><option>Found</option></select></label><label>Item Name<input name="title" required placeholder="Example: Black Wallet"></label><label>Category<select name="category"><option>ID Card</option><option>Keys</option><option>Books</option><option>Electronics</option><option>Bag</option><option>Other</option></select></label><label>Location<input name="location" required placeholder="Library, Block A..."></label><label>Description<textarea name="description" required placeholder="Color, brand, unique details..."></textarea></label><label>Photo<input type="file" name="photo" accept=".png,.jpg,.jpeg,.webp"></label><button class="btn wide">Publish Report</button></form></section>{% endblock %}
